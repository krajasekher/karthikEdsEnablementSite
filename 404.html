<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--background-color, #fff);
    }

    main.error .section {
      max-width: 600px;
      padding: 2rem 1.5rem;
    }

    main.error .error-number {
      width: min(280px, 60vw);
      margin: 0 auto 1rem;
      display: block;
    }

    main.error .error-number text {
      font-family: var(--body-font-family, monospace);
      font-weight: 700;
      fill: var(--link-color, #035fe6);
    }

    main.error .error-message {
      font-size: clamp(1.4rem, 4vw, 2rem);
      margin: 0 0 0.75rem;
      color: var(--heading-color, #000);
    }

    main.error .error-description {
      color: var(--text-color, #444);
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 1.75rem;
    }

    main.error .button-container {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 0;
    }

    main.error .button-container a.button {
      min-width: 130px;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg viewBox="1 0 38 18" class="error-number" aria-hidden="true">
        <text x="0" y="17">404</text>
      </svg>
      <h2 class="error-message">Page Not Found</h2>
      <p class="error-description">
        Oops! The page you're looking for doesn't exist or may have been moved.
        Try heading back home or use the navigation above to find what you need.
      </p>
      <p class="button-container">
        <a href="/" class="button primary error-button-home">Go home</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
